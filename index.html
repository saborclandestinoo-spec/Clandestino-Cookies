<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Vulpin — Gerenciador de Reels</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f8f7f4;
  --bg2:#ffffff;
  --bg3:#f2f1ee;
  --bg4:#eae9e5;
  --border:#e8e6e1;
  --border2:#d4d1ca;
  --red:#e8192c;
  --red2:#c0111f;
  --redbg:#fff0f1;
  --redbg2:#ffe0e2;
  --text:#1a1714;
  --text2:#6b6560;
  --text3:#b0ada6;
  --green:#16a34a;
  --greenbg:#f0fdf4;
  --amber:#d97706;
  --amberbg:#fffbeb;
  --blue:#2563eb;
  --bluebg:#eff6ff;
  --r:14px;
  --rsm:10px;
  --rlg:20px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.06);
  --shadow-lg:0 4px 6px rgba(0,0,0,.05),0 12px 40px rgba(0,0,0,.1);
  --shadow-red:0 4px 20px rgba(232,25,44,.25);
  --nav-h:64px;
}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:16px;}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ── AUTH ── */
#auth-screen{position:fixed;inset:0;background:var(--bg);z-index:9000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
.auth-card{background:var(--bg2);border-radius:var(--rlg);padding:32px 28px;width:100%;max-width:380px;box-shadow:var(--shadow-lg);}
.auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:28px;justify-content:center;}
.auth-logo-icon{width:44px;height:44px;background:var(--red);border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:800;font-size:20px;color:#fff;box-shadow:var(--shadow-red);}
.auth-logo-name{font-family:'Sora',sans-serif;font-weight:700;font-size:22px;color:var(--text);}
.auth-tabs{display:flex;background:var(--bg3);border-radius:var(--rsm);padding:3px;margin-bottom:20px;}
.auth-tab{flex:1;padding:8px;border:none;background:transparent;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;color:var(--text2);transition:all .2s;}
.auth-tab.active{background:var(--bg2);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.1);}
.auth-field{margin-bottom:12px;}
.auth-field label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px;letter-spacing:.3px;}
.auth-field input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--rsm);font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);background:var(--bg);outline:none;transition:border-color .2s;}
.auth-field input:focus{border-color:var(--red);}
.auth-msg{font-size:12px;padding:10px 12px;border-radius:var(--rsm);margin-bottom:12px;display:none;}
.auth-msg.err{background:var(--redbg2);color:var(--red2);}
.auth-msg.ok{background:var(--greenbg);color:var(--green);}
.btn-red{width:100%;padding:12px;background:var(--red);color:#fff;border:none;border-radius:var(--rsm);font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;box-shadow:var(--shadow-red);}
.btn-red:hover{background:var(--red2);transform:translateY(-1px);}
.btn-red:disabled{opacity:.5;cursor:not-allowed;transform:none;}

/* ── APP SHELL ── */
#app{display:none;flex-direction:column;height:100vh;overflow:hidden;}
#app.visible{display:flex;}

/* ── TOP HEADER ── */
.topbar{height:56px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;position:sticky;top:0;z-index:100;flex-shrink:0;}
.topbar-logo{font-family:'Sora',sans-serif;font-weight:700;font-size:18px;color:var(--text);flex:1;}
.topbar-logo span{color:var(--red);}
.topbar-avatar{width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.topbar-logout{background:none;border:none;cursor:pointer;color:var(--text3);font-size:18px;padding:4px;}

/* ── PAGE CONTENT ── */
.pages{flex:1;overflow:hidden;position:relative;}
.page{position:absolute;inset:0;overflow-y:auto;padding:20px 16px 100px;display:none;animation:fadeUp .25s ease;}
.page.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── BOTTOM NAV ── */
.bottom-nav{height:var(--nav-h);background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;padding:0 8px;flex-shrink:0;position:sticky;bottom:0;z-index:100;}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 16px;border:none;background:transparent;cursor:pointer;border-radius:12px;transition:all .2s;min-width:60px;}
.nav-btn .nav-icon{font-size:22px;line-height:1;}
.nav-btn .nav-label{font-size:10px;font-weight:500;color:var(--text3);font-family:'DM Sans',sans-serif;transition:color .2s;}
.nav-btn.active .nav-label{color:var(--red);}
.nav-btn.active .nav-icon{filter:none;}
.nav-btn.active{background:var(--redbg);}

/* ── PAGE HEADER ── */
.ph{margin-bottom:20px;}
.ph-title{font-family:'Sora',sans-serif;font-weight:700;font-size:24px;color:var(--text);line-height:1.2;}
.ph-sub{font-size:13px;color:var(--text2);margin-top:3px;}
.ph-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}

/* ── BUTTONS ── */
.btn-primary{display:flex;align-items:center;gap:6px;padding:10px 18px;background:var(--red);color:#fff;border:none;border-radius:var(--rsm);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap;box-shadow:var(--shadow-red);}
.btn-primary:hover{background:var(--red2);transform:translateY(-1px);}
.btn-ghost{padding:9px 14px;background:var(--bg2);color:var(--text2);border:1.5px solid var(--border);border-radius:var(--rsm);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;transition:all .2s;}
.btn-ghost:hover{border-color:var(--red);color:var(--red);}
.btn-icon{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg2);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s;flex-shrink:0;}
.btn-icon:hover{border-color:var(--red);color:var(--red);}

/* ── CARDS ── */
.card{background:var(--bg2);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:10px;}
.card-title{font-family:'Sora',sans-serif;font-weight:600;font-size:14px;color:var(--text);margin-bottom:12px;}

/* ── METRICS ── */
.metrics-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
.metric-card{background:var(--bg2);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.metric-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;}
.metric-card.red::after{background:var(--red);}
.metric-card.green::after{background:var(--green);}
.metric-card.amber::after{background:var(--amber);}
.metric-card.blue::after{background:var(--blue);}
.metric-num{font-family:'Sora',sans-serif;font-size:36px;font-weight:800;line-height:1;margin-bottom:2px;}
.metric-card.red .metric-num{color:var(--red);}
.metric-card.green .metric-num{color:var(--green);}
.metric-card.amber .metric-num{color:var(--amber);}
.metric-card.blue .metric-num{color:var(--blue);}
.metric-lbl{font-size:11px;color:var(--text2);font-weight:500;text-transform:uppercase;letter-spacing:.5px;}

/* ── STATUS PILLS ── */
.st-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
.st-pill.pensado{background:var(--bg3);color:var(--text2);}
.st-pill.gravado{background:var(--bluebg);color:var(--blue);}
.st-pill.editado{background:var(--amberbg);color:var(--amber);}
.st-pill.postado{background:var(--greenbg);color:var(--green);}

/* ── PIPELINE ── */
.pipeline{display:flex;flex-direction:column;gap:8px;}
.pipe-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg3);border-radius:var(--rsm);}
.pipe-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.pipe-lbl{flex:1;font-size:13px;color:var(--text2);}
.pipe-bar-wrap{width:80px;height:4px;background:var(--bg4);border-radius:2px;overflow:hidden;}
.pipe-bar{height:100%;border-radius:2px;transition:width .5s ease;}
.pipe-count{font-family:'Sora',sans-serif;font-size:16px;font-weight:700;color:var(--text);min-width:20px;text-align:right;}

/* ── IDEIAS LIST ── */
.search-bar{display:flex;gap:8px;margin-bottom:14px;}
.search-input{flex:1;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--rsm);font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);background:var(--bg2);outline:none;transition:border-color .2s;}
.search-input:focus{border-color:var(--red);}
.filter-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;overflow-x:auto;padding-bottom:4px;}
.filter-chips::-webkit-scrollbar{display:none;}
.chip{padding:5px 12px;border-radius:20px;border:1.5px solid var(--border);background:var(--bg2);color:var(--text2);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .15s;}
.chip.active{background:var(--red);color:#fff;border-color:var(--red);}
.chip:hover:not(.active){border-color:var(--red);color:var(--red);}

/* ── IDEA ROW ── */
.idea-row{background:var(--bg2);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;transition:box-shadow .2s;}
.idea-row:hover{box-shadow:var(--shadow-lg);}
.idea-check{width:20px;height:20px;border-radius:6px;border:2px solid var(--border2);background:transparent;cursor:pointer;flex-shrink:0;margin-top:2px;appearance:none;-webkit-appearance:none;position:relative;transition:all .15s;}
.idea-check:checked{background:var(--green);border-color:var(--green);}
.idea-check:checked::after{content:'✓';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:11px;font-weight:700;}
.idea-body{flex:1;min-width:0;}
.idea-txt{font-size:14px;color:var(--text);line-height:1.5;cursor:pointer;font-weight:400;}
.idea-txt:hover{color:var(--red);}
.idea-row.done .idea-txt{text-decoration:line-through;color:var(--text3);}
.idea-meta{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap;}
.plat-badge{font-size:10px;color:var(--text2);background:var(--bg3);padding:2px 7px;border-radius:20px;}
.hora-badge{font-size:10px;color:var(--text3);}
.tag-badge{font-size:10px;color:var(--text3);background:var(--bg4);padding:2px 7px;border-radius:20px;}
.idea-st-bar{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap;}
.st-btn{padding:3px 10px;border-radius:20px;border:1.5px solid var(--border);background:transparent;color:var(--text3);font-size:11px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;}
.st-btn:hover{border-color:var(--red);color:var(--red);}
.st-btn.active{background:var(--red);color:#fff;border-color:var(--red);}
.idea-actions{display:flex;flex-direction:column;gap:4px;flex-shrink:0;}
.idea-act-btn{width:28px;height:28px;border-radius:8px;border:none;background:var(--bg3);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .15s;}
.idea-act-btn:hover{background:var(--redbg2);color:var(--red);}

/* ── CALENDAR ── */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-month{font-family:'Sora',sans-serif;font-weight:700;font-size:18px;color:var(--text);}
.cal-wrap{background:var(--bg2);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px;}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);background:var(--bg3);border-bottom:1px solid var(--border);}
.cal-hcell{padding:8px 2px;text-align:center;font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;}
.cal-body{display:grid;grid-template-columns:repeat(7,1fr);}
.cal-cell{min-height:72px;padding:4px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);position:relative;transition:background .12s;cursor:pointer;}
.cal-cell:nth-child(7n){border-right:none;}
.cal-cell:hover{background:var(--bg3);}
.cal-cell.empty{background:var(--bg3);cursor:default;}
.cal-cell.drop-over{background:var(--redbg)!important;border-color:var(--red)!important;}
.cal-day{font-size:11px;font-weight:500;color:var(--text2);width:20px;height:20px;display:flex;align-items:center;justify-content:center;margin-bottom:2px;}
.cal-cell.today .cal-day{background:var(--red);color:#fff;border-radius:50%;}
.cal-ev{font-size:9px;padding:2px 5px;border-radius:5px;margin-bottom:2px;display:flex;align-items:center;gap:2px;cursor:grab;line-height:1.3;border:1px solid transparent;}
.cal-ev:active{cursor:grabbing;opacity:.6;}
.cal-ev.dragging-ev{opacity:.3;}
.cal-ev-txt{overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;flex:1;font-weight:500;}
.cal-ev.pensado{background:#f1f0ed;color:var(--text2);border-color:var(--border);}
.cal-ev.gravado{background:var(--bluebg);color:var(--blue);border-color:#bfdbfe;}
.cal-ev.editado{background:var(--amberbg);color:var(--amber);border-color:#fde68a;}
.cal-ev.postado{background:var(--greenbg);color:var(--green);border-color:#bbf7d0;}
.cal-ev-rm{font-size:9px;opacity:0;border:none;background:none;cursor:pointer;color:inherit;padding:0;line-height:1;flex-shrink:0;}
.cal-ev:hover .cal-ev-rm{opacity:.8;}

/* ── AGENDA SECTION ── */
.agenda-item{background:var(--bg2);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:8px;display:flex;gap:12px;align-items:center;border-left:4px solid var(--border);}
.agenda-item.pensado{border-left-color:var(--text3);}
.agenda-item.gravado{border-left-color:var(--blue);}
.agenda-item.editado{border-left-color:var(--amber);}
.agenda-item.postado{border-left-color:var(--green);}
.agenda-date{text-align:center;flex-shrink:0;min-width:36px;}
.agenda-day{font-family:'Sora',sans-serif;font-size:22px;font-weight:800;line-height:1;color:var(--text);}
.agenda-weekday{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;}
.agenda-body{flex:1;min-width:0;}
.agenda-txt{font-size:14px;font-weight:500;color:var(--text);line-height:1.4;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.agenda-meta{display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap;}
.agenda-plat{font-size:11px;color:var(--text2);}
.agenda-hora{font-size:11px;color:var(--text3);}

/* ── AI PAGE ── */
.ai-tabs{display:flex;background:var(--bg3);border-radius:var(--rsm);padding:3px;margin-bottom:16px;gap:2px;overflow-x:auto;}
.ai-tab{flex:1;padding:9px 8px;border:none;background:transparent;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;color:var(--text2);transition:all .2s;white-space:nowrap;}
.ai-tab.active{background:var(--bg2);color:var(--red);box-shadow:0 1px 4px rgba(0,0,0,.1);}
.ai-panel{display:none;}
.ai-panel.active{display:block;}
.ai-inp-box{background:var(--bg2);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px;}
.ai-inp-box label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px;}
.ai-inp{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--rsm);font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);background:var(--bg);outline:none;transition:border-color .2s;margin-bottom:10px;}
.ai-inp:focus{border-color:var(--red);}
.ai-ta{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--rsm);font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);background:var(--bg);outline:none;resize:vertical;line-height:1.6;transition:border-color .2s;margin-bottom:10px;}
.ai-ta:focus{border-color:var(--red);}
.ai-result{min-height:40px;}
.ai-loading{display:flex;align-items:center;gap:10px;padding:16px;background:var(--bg2);border-radius:var(--r);box-shadow:var(--shadow);color:var(--text2);font-size:13px;}
.ai-spin{width:18px;height:18px;border:2px solid var(--border2);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-card{background:var(--bg2);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:10px;}
.ai-card-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px;}
.ai-card-title{font-weight:600;font-size:14px;color:var(--text);flex:1;line-height:1.4;}
.score-chip{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;flex-shrink:0;}
.score-chip.hi{background:var(--greenbg);color:var(--green);}
.score-chip.mid{background:var(--amberbg);color:var(--amber);}
.score-chip.lo{background:var(--redbg2);color:var(--red);}
.ai-card-body{font-size:13px;color:var(--text2);line-height:1.7;}
.ai-card-body strong{color:var(--text);}
.sbar{display:flex;align-items:center;gap:8px;margin:4px 0;}
.sbar-lbl{font-size:10px;color:var(--text3);width:110px;flex-shrink:0;}
.sbar-track{flex:1;height:4px;background:var(--bg4);border-radius:2px;overflow:hidden;}
.sbar-fill{height:100%;border-radius:2px;}
.sbar-fill.v{background:var(--red);}
.sbar-fill.g{background:var(--blue);}
.sbar-fill.s{background:var(--green);}
.sbar-fill.vd{background:var(--amber);}
.sbar-val{font-size:10px;color:var(--text3);width:22px;text-align:right;}
.ai-save-btn{margin-top:10px;padding:6px 12px;background:var(--bg3);border:1.5px solid var(--border);border-radius:var(--rsm);color:var(--text2);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;}
.ai-save-btn:hover{background:var(--redbg);color:var(--red);border-color:var(--red);}
.cal30{display:flex;flex-direction:column;gap:6px;}
.cal30-item{background:var(--bg2);border-radius:var(--rsm);padding:10px 14px;box-shadow:var(--shadow);border-left:3px solid var(--red);}
.cal30-day{font-size:10px;color:var(--red);font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:2px;}
.cal30-tema{font-size:13px;color:var(--text);font-weight:500;}
.cal30-tipo{font-size:11px;color:var(--text2);margin-top:2px;}
.rot-card{background:var(--bg2);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:10px;}
.rot-dur{font-size:10px;color:var(--red);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;}
.rot-title{font-family:'Sora',sans-serif;font-size:16px;font-weight:700;color:var(--text);margin-bottom:10px;}
.rot-body{font-size:13px;color:var(--text2);line-height:1.8;white-space:pre-wrap;}

/* ── MODAL ── */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:500;display:none;align-items:flex-end;justify-content:center;}
.modal-ov.active{display:flex;}
@media(min-width:600px){.modal-ov{align-items:center;}}
.modal{background:var(--bg2);border-radius:var(--rlg) var(--rlg) 0 0;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;animation:slideUp .3s ease;}
@media(min-width:600px){.modal{border-radius:var(--rlg);}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:10px auto 0;}
.modal-hd{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-title{font-family:'Sora',sans-serif;font-weight:700;font-size:18px;}
.modal-close{width:30px;height:30px;border-radius:8px;border:none;background:var(--bg3);color:var(--text2);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
.modal-body{padding:16px 20px;}
.modal-ft{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;}
.fg{margin-bottom:14px;}
.fg label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px;}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--rsm);font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);background:var(--bg);outline:none;transition:border-color .2s;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--red);}
.fg select option{background:var(--bg2);}
.fg textarea{resize:vertical;}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* ── TOAST ── */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--text);color:#fff;border-radius:20px;padding:10px 20px;font-size:13px;font-weight:500;opacity:0;transition:all .2s;pointer-events:none;white-space:nowrap;z-index:9999;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.err{background:var(--red);}
.toast.ok{background:var(--green);}

/* ── EMPTY ── */
.empty-state{text-align:center;padding:40px 20px;color:var(--text3);}
.empty-icon{font-size:40px;margin-bottom:10px;}
.empty-txt{font-size:14px;}

/* ── ALERT BANNER ── */
.alert-banner{background:var(--bg2);border:1.5px solid var(--red);border-radius:var(--r);padding:14px;margin-bottom:16px;box-shadow:var(--shadow-red);}
.alert-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.alert-hd-txt{font-size:13px;font-weight:600;color:var(--red);}
.alert-hd button{background:none;border:none;cursor:pointer;color:var(--text3);font-size:16px;}
.alert-item{padding:8px 10px;background:var(--bg3);border-radius:var(--rsm);margin-bottom:6px;}
.alert-item:last-child{margin-bottom:0;}
.alert-item-name{font-size:13px;font-weight:500;color:var(--text);}
.alert-item-msg{font-size:11px;color:var(--red);margin-top:2px;}

/* ── DESKTOP ── */
@media(min-width:768px){
  .topbar{padding:0 32px;}
  .pages{display:grid;grid-template-columns:1fr;}
  .page{padding:28px 32px 40px;}
  .metrics-row{grid-template-columns:repeat(4,1fr);}
  .modal-ov{align-items:center;}
  .bottom-nav{display:flex;justify-content:center;gap:8px;}
  .nav-btn{flex-direction:row;gap:6px;min-width:auto;padding:10px 20px;}
  .nav-btn .nav-label{font-size:13px;}
}

// ── SUPABASE ──────────────────────────────────────────
const SUPA_URL='https://bctbydbntjeswrwjruia.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJjdGJ5ZGJudGplc3dyd2pydWlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMTk3MjksImV4cCI6MjA5NzY5NTcyOX0.wqmPRmGdjEykDMsEFYWf26AMTA6eUl43vinN_Y7bkQA';
const {createClient}=supabase;
const db=createClient(SUPA_URL,SUPA_KEY);

// ── STATE ─────────────────────────────────────────────
let user=null;
let ideias=[];
let icalEvents={};
let calM=new Date().getMonth(),calY=new Date().getFullYear();
let iFilter='',dragIdeaId=null,dragIcalEid=null,dragIcalDs=null;

// ── HELPERS ───────────────────────────────────────────
const gid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const escA=s=>String(s||'').replace(/'/g,"\\'");
const platIcon={instagram:'📸',tiktok:'🎵',youtube:'▶️',facebook:'👤'};
const platName={instagram:'Instagram',tiktok:'TikTok',youtube:'YT Shorts',facebook:'Facebook'};
const stLbl={pensado:'Pensado',gravado:'Gravado',editado:'Editado',postado:'Postado'};
const stColor={pensado:'#9ca3af',gravado:'#2563eb',editado:'#d97706',postado:'#16a34a'};
const months=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const weekdays=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

function toast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className=`toast show ${type}`;
  setTimeout(()=>t.className='toast',2600);
}

// ── AUTH ──────────────────────────────────────────────
let authMode='login';
function setAuthMode(m){
  authMode=m;
  document.getElementById('tab-login').classList.toggle('active',m==='login');
  document.getElementById('tab-signup').classList.toggle('active',m==='signup');
  document.getElementById('auth-btn').textContent=m==='login'?'Entrar':'Criar conta';
  document.getElementById('auth-msg').style.display='none';
}
async function doAuth(){
  const email=document.getElementById('auth-email').value.trim();
  const pass=document.getElementById('auth-pass').value;
  const msg=document.getElementById('auth-msg');
  const btn=document.getElementById('auth-btn');
  msg.style.display='none';
  if(!email||!pass){showMsg('Preencha email e senha.','err');return;}
  if(pass.length<6){showMsg('Senha mínima de 6 caracteres.','err');return;}
  btn.textContent='Aguarde...';btn.disabled=true;
  try{
    const res=authMode==='login'
      ?await db.auth.signInWithPassword({email,password:pass})
      :await db.auth.signUp({email,password:pass});
    if(res.error){showMsg(traduzErro(res.error.message),'err');btn.disabled=false;btn.textContent=authMode==='login'?'Entrar':'Criar conta';return;}
    if(authMode==='signup'&&!res.data.session){showMsg('Conta criada! Verifique seu email e faça login.','ok');setAuthMode('login');btn.disabled=false;btn.textContent='Entrar';return;}
  }catch(e){showMsg('Erro de conexão: '+e.message,'err');}
  btn.disabled=false;btn.textContent=authMode==='login'?'Entrar':'Criar conta';
}
function showMsg(txt,type){
  const m=document.getElementById('auth-msg');
  m.textContent=txt;m.className='auth-msg '+type;m.style.display='block';
}
function traduzErro(e){
  const map={'Invalid login credentials':'Email ou senha incorretos.','Email not confirmed':'Confirme seu email primeiro.','User already registered':'Email já cadastrado.'};
  return map[e]||e;
}
async function doLogout(){await db.auth.signOut();}

db.auth.onAuthStateChange((evt,session)=>{
  if(session?.user){
    user=session.user;
    document.getElementById('auth-screen').style.display='none';
    document.getElementById('app').classList.add('visible');
    const initials=user.email[0].toUpperCase();
    document.getElementById('user-av').textContent=initials;
    loadAll();
  }else{
    user=null;ideias=[];icalEvents={};
    document.getElementById('auth-screen').style.display='flex';
    document.getElementById('app').classList.remove('visible');
  }
});

// ── DATA ──────────────────────────────────────────────
async function loadAll(){
  try{
    const[ri,re]=await Promise.all([
      db.from('ideias').select('*').order('criado',{ascending:false}),
      db.from('ical_events').select('*')
    ]);
    ideias=ri.data||[];
    icalEvents={};
    (re.data||[]).forEach(e=>{
      if(!icalEvents[e.date_str])icalEvents[e.date_str]=[];
      icalEvents[e.date_str].push({eid:e.eid,id:e.idea_id,txt:e.txt,tp:e.tp});
    });
  }catch(e){console.warn(e);ideias=[];icalEvents={};}
  renderAll();
}
function renderAll(){renderDash();renderIdeias();renderCal();buildAgenda();checkAlerts();}

// ── NAV ───────────────────────────────────────────────
document.querySelectorAll('.nav-btn').forEach(b=>{
  b.addEventListener('click',()=>goPage(b.dataset.page));
});
function goPage(p){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  document.querySelector(`[data-page="${p}"]`).classList.add('active');
}

// ── MODAL ─────────────────────────────────────────────
function openModal(id,data){
  const el=document.getElementById(id);
  el.classList.add('active');
  if(id==='mi'){
    document.getElementById('mi-title').textContent=data?'Editar Ideia':'Nova Ideia';
    document.getElementById('i-id').value=data?.id||'';
    document.getElementById('i-txt').value=data?.txt||'';
    document.getElementById('i-tp').value=data?.tp||'ideia';
    document.getElementById('i-st').value=data?.st||'pensado';
    document.getElementById('i-plat').value=data?.plat||'instagram';
    document.getElementById('i-hora').value=data?.hora||'';
    document.getElementById('i-tags').value=(data?.tags||[]).join(', ');
  }
}
function closeModal(id){document.getElementById(id).classList.remove('active');}
document.querySelectorAll('.modal-ov').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('active');}));

// ── IDEIAS CRUD ───────────────────────────────────────
async function salvarIdeia(){
  const txt=document.getElementById('i-txt').value.trim();
  if(!txt){toast('Preencha o conteúdo!','err');return;}
  const id=document.getElementById('i-id').value||gid();
  const obj={
    id,txt,
    tp:document.getElementById('i-tp').value,
    st:document.getElementById('i-st').value,
    plat:document.getElementById('i-plat').value,
    hora:document.getElementById('i-hora').value,
    tags:document.getElementById('i-tags').value.split(',').map(t=>t.trim()).filter(Boolean),
    criado:ideias.find(i=>i.id===id)?.criado||Date.now(),
    user_id:user.id
  };
  const idx=ideias.findIndex(i=>i.id===id);
  idx>=0?ideias[idx]=obj:ideias.unshift(obj);
  // sync ical text
  Object.keys(icalEvents).forEach(ds=>{
    icalEvents[ds]=(icalEvents[ds]||[]).map(ev=>ev.id===id?{...ev,txt:obj.txt,tp:obj.tp}:ev);
  });
  try{
    await db.from('ideias').upsert(obj);
    await db.from('ical_events').update({txt:obj.txt,tp:obj.tp}).eq('idea_id',id);
  }catch(e){console.warn(e);}
  closeModal('mi');toast('Ideia salva! 💡','ok');renderAll();
}
async function delIdeia(id){
  if(!confirm('Excluir esta ideia?'))return;
  ideias=ideias.filter(i=>i.id!==id);
  Object.keys(icalEvents).forEach(ds=>{icalEvents[ds]=(icalEvents[ds]||[]).filter(e=>e.id!==id);if(!icalEvents[ds].length)delete icalEvents[ds];});
  try{await db.from('ideias').delete().eq('id',id);await db.from('ical_events').delete().eq('idea_id',id);}catch(e){console.warn(e);}
  toast('Excluída.','err');renderAll();
}
async function setSt(id,st,e){
  if(e)e.stopPropagation();
  const idx=ideias.findIndex(i=>i.id===id);if(idx<0)return;
  ideias[idx].st=st;
  try{await db.from('ideias').update({st}).eq('id',id);}catch(e){console.warn(e);}
  toast(stLbl[st]+' ✓');renderAll();
}

// ── RENDER DASHBOARD ──────────────────────────────────
function renderDash(){
  document.getElementById('m-total').textContent=ideias.length;
  document.getElementById('m-post').textContent=ideias.filter(i=>i.st==='postado').length;
  document.getElementById('m-prod').textContent=ideias.filter(i=>i.st==='gravado'||i.st==='editado').length;
  document.getElementById('m-pens').textContent=ideias.filter(i=>i.st==='pensado').length;
  const tot=ideias.length||1;
  const pipe=document.getElementById('pipeline');
  pipe.innerHTML=['pensado','gravado','editado','postado'].map(s=>{
    const cnt=ideias.filter(i=>i.st===s).length;
    const pct=Math.round(cnt/tot*100);
    return `<div class="pipe-row">
      <div class="pipe-dot" style="background:${stColor[s]}"></div>
      <span class="pipe-lbl">${stLbl[s]}</span>
      <div class="pipe-bar-wrap"><div class="pipe-bar" style="width:${pct}%;background:${stColor[s]}"></div></div>
      <span class="pipe-count">${cnt}</span>
    </div>`;
  }).join('');
  const rec=document.getElementById('recent-ideas');
  const list=ideias.slice(0,4);
  if(!list.length){rec.innerHTML='<div class="empty-state"><div class="empty-icon">💡</div><div class="empty-txt">Nenhuma ideia ainda</div></div>';return;}
  rec.innerHTML=list.map(i=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)" onclick="openModal('mi',${JSON.stringify(i).replace(/"/g,'&quot;')})">
    <span style="font-size:18px">${platIcon[i.plat||'instagram']}</span>
    <div style="flex:1;min-width:0">
      <div style="font-size:13px;font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${esc(i.txt)}</div>
      <span class="st-pill ${i.st||'pensado'}">${stLbl[i.st||'pensado']}</span>
    </div>
  </div>`).join('');
}

// ── RENDER IDEIAS ─────────────────────────────────────
function renderIdeias(){
  const q=(document.getElementById('si-q')?.value||'').toLowerCase();
  const list=ideias.filter(i=>(i.txt||'').toLowerCase().includes(q)&&(!iFilter||i.tp===iFilter));
  const el=document.getElementById('ideias-list');
  if(!list.length){el.innerHTML='<div class="empty-state"><div class="empty-icon">💡</div><div class="empty-txt">Nenhuma ideia encontrada</div></div>';return;}
  el.innerHTML=list.map(i=>{
    const st=i.st||'pensado';
    const done=st==='postado';
    return `<div class="idea-row${done?' done':''}" draggable="true" data-id="${i.id}">
      <input type="checkbox" class="idea-check" ${done?'checked':''} onchange="setSt('${i.id}',this.checked?'postado':'pensado',event)"/>
      <div class="idea-body">
        <div class="idea-txt" onclick="openModal('mi',ideias.find(x=>x.id==='${i.id}'))">${esc(i.txt)}</div>
        <div class="idea-meta">
          <span class="st-pill ${st}">${stLbl[st]}</span>
          <span class="plat-badge">${platIcon[i.plat||'instagram']} ${platName[i.plat||'instagram']}</span>
          ${i.hora?`<span class="hora-badge">⏰ ${i.hora}</span>`:''}
          ${(i.tags||[]).map(t=>`<span class="tag-badge">#${esc(t)}</span>`).join('')}
        </div>
        <div class="idea-st-bar">
          ${['pensado','gravado','editado','postado'].map(s=>`<button class="st-btn${st===s?' active':''}" onclick="setSt('${i.id}','${s}',event)">${stLbl[s]}</button>`).join('')}
        </div>
      </div>
      <div class="idea-actions">
        <button class="idea-act-btn" onclick="openModal('mi',ideias.find(x=>x.id==='${i.id}'))" title="Editar">✏</button>
        <button class="idea-act-btn" onclick="delIdeia('${i.id}')" title="Excluir">🗑</button>
      </div>
    </div>`;
  }).join('');
  // drag from bank
  el.querySelectorAll('.idea-row').forEach(row=>{
    row.addEventListener('dragstart',e=>{dragIdeaId=row.dataset.id;dragIcalEid=null;e.dataTransfer.effectAllowed='copy';});
    row.addEventListener('dragend',()=>{dragIdeaId=null;});
  });
}
// filter chips
document.getElementById('filter-chips').addEventListener('click',e=>{
  const chip=e.target.closest('.chip');if(!chip)return;
  iFilter=chip.dataset.f;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c===chip));
  renderIdeias();
});

// ── RENDER CALENDAR ───────────────────────────────────
function renderCal(){
  document.getElementById('cal-title').textContent=`${months[calM]} ${calY}`;
  const fd=new Date(calY,calM,1).getDay();
  const dim=new Date(calY,calM+1,0).getDate();
  const td=new Date();
  let h='';
  for(let i=0;i<fd;i++)h+=`<div class="cal-cell empty"></div>`;
  for(let d=1;d<=dim;d++){
    const isT=d===td.getDate()&&calM===td.getMonth()&&calY===td.getFullYear();
    const ds=`${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs=icalEvents[ds]||[];
    const idea0=evs[0]?ideias.find(i=>i.id===evs[0].id):null;
    const st0=idea0?.st||'pensado';
    h+=`<div class="cal-cell${isT?' today':''}" data-date="${ds}">
      <div class="cal-day">${d}</div>
      ${evs.map(e=>{
        const idea=ideias.find(i=>i.id===e.id)||{};
        const st=idea.st||'pensado';
        return `<div class="cal-ev ${st}" draggable="true" data-eid="${e.eid}" data-ds="${ds}">
          <span class="cal-ev-txt">${esc(e.txt)}</span>
          <button class="cal-ev-rm" onclick="removeCalEv('${ds}','${e.eid}',event)">✕</button>
        </div>`;
      }).join('')}
    </div>`;
  }
  document.getElementById('cal-body').innerHTML=h;
  bindCalDrag();
}
function bindCalDrag(){
  // drag cal events
  document.querySelectorAll('.cal-ev[data-eid]').forEach(ev=>{
    ev.addEventListener('dragstart',e=>{
      e.stopPropagation();
      dragIcalEid=ev.dataset.eid;dragIcalDs=ev.dataset.ds;dragIdeaId=null;
      e.dataTransfer.effectAllowed='move';
      setTimeout(()=>ev.classList.add('dragging-ev'),0);
    });
    ev.addEventListener('dragend',()=>{ev.classList.remove('dragging-ev');dragIcalEid=null;dragIcalDs=null;});
  });
  // drop zones
  document.querySelectorAll('.cal-cell[data-date]').forEach(cell=>{
    cell.addEventListener('dragover',e=>{e.preventDefault();cell.classList.add('drop-over');});
    cell.addEventListener('dragleave',()=>cell.classList.remove('drop-over'));
    cell.addEventListener('drop',e=>{
      e.preventDefault();cell.classList.remove('drop-over');
      const targetDs=cell.dataset.date;
      if(dragIcalEid&&dragIcalDs&&dragIcalDs!==targetDs){
        // MOVE event
        const src=icalEvents[dragIcalDs]||[];
        const ev=src.find(x=>x.eid===dragIcalEid);if(!ev)return;
        icalEvents[dragIcalDs]=src.filter(x=>x.eid!==dragIcalEid);
        if(!icalEvents[dragIcalDs].length)delete icalEvents[dragIcalDs];
        if(!icalEvents[targetDs])icalEvents[targetDs]=[];
        const newEv={...ev,eid:gid()};
        icalEvents[targetDs].push(newEv);
        db.from('ical_events').delete().eq('eid',dragIcalEid).then(()=>{
          db.from('ical_events').insert({id:newEv.eid,eid:newEv.eid,user_id:user.id,date_str:targetDs,idea_id:ev.id,txt:ev.txt,tp:ev.tp});
        });
        renderCal();buildAgenda();toast('Post movido! 📅');return;
      }
      if(dragIdeaId){
        const idea=ideias.find(i=>i.id===dragIdeaId);if(!idea)return;
        if(!icalEvents[targetDs])icalEvents[targetDs]=[];
        if(icalEvents[targetDs].some(ev=>ev.id===dragIdeaId))return;
        const newEv={eid:gid(),id:dragIdeaId,txt:idea.txt,tp:idea.tp};
        icalEvents[targetDs].push(newEv);
        db.from('ical_events').insert({id:newEv.eid,eid:newEv.eid,user_id:user.id,date_str:targetDs,idea_id:dragIdeaId,txt:idea.txt,tp:idea.tp}).catch(console.warn);
        renderCal();buildAgenda();renderIdeias();toast('Agendado! 📅');
      }
    });
  });
}
function chM(d){calM+=d;if(calM>11){calM=0;calY++;}if(calM<0){calM=11;calY--;}renderCal();buildAgenda();}
function removeCalEv(ds,eid,e){
  if(e)e.stopPropagation();
  if(!icalEvents[ds])return;
  icalEvents[ds]=icalEvents[ds].filter(x=>x.eid!==eid);
  if(!icalEvents[ds].length)delete icalEvents[ds];
  db.from('ical_events').delete().eq('eid',eid).catch(console.warn);
  renderCal();buildAgenda();renderIdeias();
}

// ── AGENDA ───────────────────────────────────────────
function buildAgenda(){
  const today=new Date();today.setHours(0,0,0,0);
  const items=[];
  Object.keys(icalEvents).sort().forEach(ds=>{
    const d=new Date(ds+'T00:00:00');
    if(d<today)return;
    (icalEvents[ds]||[]).forEach(e=>{
      const idea=ideias.find(i=>i.id===e.id)||{};
      items.push({ds,d,e,idea});
    });
  });
  const el=document.getElementById('agenda-list');
  if(!items.length){el.innerHTML='<div class="empty-state"><div class="empty-icon">📅</div><div class="empty-txt">Nenhum post agendado</div></div>';return;}
  el.innerHTML=items.slice(0,10).map(({ds,d,e,idea})=>{
    const st=idea.st||'pensado';
    const day=d.getDate();
    const wd=weekdays[d.getDay()];
    return `<div class="agenda-item ${st}">
      <div class="agenda-date"><div class="agenda-day">${day}</div><div class="agenda-weekday">${wd}</div></div>
      <div class="agenda-body">
        <div class="agenda-txt">${esc(e.txt)}</div>
        <div class="agenda-meta">
          <span class="agenda-plat">${platIcon[idea.plat||'instagram']} ${platName[idea.plat||'instagram']}</span>
          ${idea.hora?`<span class="agenda-hora">⏰ ${idea.hora}</span>`:''}
          <span class="st-pill ${st}">${stLbl[st]}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── ALERTS ───────────────────────────────────────────
function checkAlerts(){
  const el=document.getElementById('alert-area');el.innerHTML='';
  const amanha=new Date();amanha.setDate(amanha.getDate()+1);
  const ds=`${amanha.getFullYear()}-${String(amanha.getMonth()+1).padStart(2,'0')}-${String(amanha.getDate()).padStart(2,'0')}`;
  const evs=icalEvents[ds]||[];
  if(!evs.length)return;
  const msgs={pensado:'⚠️ Ainda não gravado!',gravado:'✂️ Precisa editar!',editado:'✅ Pronto para postar!',postado:'🎉 Já postado!'};
  const banner=document.createElement('div');
  banner.className='alert-banner';
  banner.innerHTML=`<div class="alert-hd"><span class="alert-hd-txt">🔔 ${evs.length} post${evs.length>1?'s':''} amanhã</span><button onclick="this.closest('.alert-banner').remove()">✕</button></div>
  ${evs.map(e=>{const idea=ideias.find(i=>i.id===e.id)||{};const st=idea.st||'pensado';return `<div class="alert-item"><div class="alert-item-name">${platIcon[idea.plat||'instagram']} ${esc(e.txt)}${idea.hora?' ⏰'+idea.hora:''}</div><div class="alert-item-msg">${msgs[st]}</div></div>`;}).join('')}`;
  el.appendChild(banner);
}

// ── AI TABS ───────────────────────────────────────────
document.querySelectorAll('.ai-tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.ai-tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.ai-panel').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById(t.dataset.tab).classList.add('active');
  });
});

// ── AI CALLS ─────────────────────────────────────────
async function callAI(prompt,system){
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system,messages:[{role:'user',content:prompt}]})});
  if(!r.ok)throw new Error('API error '+r.status);
  const d=await r.json();return d.content?.[0]?.text||'';
}
function aiLoad(id,msg){document.getElementById(id).innerHTML=`<div class="ai-loading"><div class="ai-spin"></div><span>${msg}</span></div>`;}
function scCls(n){return n>=75?'hi':n>=50?'mid':'lo';}
function sbars(s){return[['Viral',s.viral,'v'],['Gravação',s.gravacao,'g'],['Seguidores',s.seguidores,'s'],['Vendas',s.vendas,'vd']].map(([l,v,c])=>`<div class="sbar"><span class="sbar-lbl">${l}</span><div class="sbar-track"><div class="sbar-fill ${c}" style="width:${v}%"></div></div><span class="sbar-val">${v}</span></div>`).join('');}

async function gerarIdeias(){
  const nicho=document.getElementById('ai-n1').value.trim();if(!nicho){toast('Digite um nicho!','err');return;}
  const btn=document.getElementById('btn-ai1');btn.disabled=true;
  aiLoad('r-ideias',`Gerando ideias para "${nicho}"...`);
  try{
    const raw=await callAI(`Nicho: ${nicho}`,`Você é Vulpin AI. Gere 8 ideias de Reels. Responda em português. APENAS JSON: {"ideias":[{"titulo":"...","gancho":"...","cta":"...","scores":{"viral":N,"gravacao":N,"seguidores":N,"vendas":N}}]}`);
    const p=JSON.parse(raw.replace(/```json|```/g,'').trim());
    document.getElementById('r-ideias').innerHTML=`<div>${(p.ideias||[]).map((id,i)=>{const tot=Math.round(Object.values(id.scores).reduce((a,b)=>a+b,0)/4);return `<div class="ai-card"><div class="ai-card-hd"><div class="ai-card-title">${i+1}. ${esc(id.titulo)}</div><span class="score-chip ${scCls(tot)}">⚡${tot}</span></div><div class="ai-card-body"><strong>🎯 Gancho:</strong> ${esc(id.gancho)}<br/><strong>📣 CTA:</strong> ${esc(id.cta)}<div style="margin-top:8px">${sbars(id.scores)}</div></div><button class="ai-save-btn" onclick="salvarDoAI('${escA(id.titulo+'\\n\\nGancho: '+id.gancho)}','gancho',['${escA(nicho)}'])">💾 Salvar no banco</button></div>`;}).join('')}</div>`;
    toast('8 ideias geradas! ✨','ok');
  }catch(e){document.getElementById('r-ideias').innerHTML=`<div class="empty-state"><div class="empty-txt">Erro: ${esc(e.message)}</div></div>`;}
  btn.disabled=false;
}

async function gerarCal(){
  const nicho=document.getElementById('ai-n2').value.trim();if(!nicho){toast('Digite um nicho!','err');return;}
  const btn=document.getElementById('btn-ai2');btn.disabled=true;

    const raw=await callAI(`Nicho: ${nicho}`,`Você é Vulpin AI. Crie calendário 30 dias de Reels. Responda em português. APENAS JSON: {"dias":[{"dia":N,"tema":"...","objetivo":"...","tipo":"..."}]}`);

async function gerarRot(){
  const tema=document.getElementById('ai-n3').value.trim();if(!tema){toast('Digite um tema!','err');return;}
  const btn=document.getElementById('btn-ai3');btn.disabled=true;

    const raw=await callAI(`Tema: ${tema}`,`Você é Vulpin AI roteirista. Crie 3 roteiros: 15s, 30s, 60s. Responda em português. APENAS JSON: {"roteiros":[{"duracao":"15s","titulo":"...","roteiro":"..."}]}`);

    toast('Roteiros gerados! 🎬','ok');
  }catch(e){document.getElementById('r-rot').innerHTML=`<div class="empty-state"><div class="empty-txt">Erro: ${esc(e.message)}</div></div>`;}

async function analisarPerf(){
  const bio=document.getElementById('ai-bio').value.trim();if(!bio){toast('Cole sua bio!','err');return;}
  const btn=document.getElementById('btn-ai4');btn.disabled=true;
  aiLoad('r-perf','Analisando seu perfil...');
  try{
    const raw=await callAI(`Bio: "${bio}"`,`Você é Vulpin AI. Analise a bio Instagram. Responda em português. APENAS JSON: {"nicho":"...","posicionamento":"...","bio_melhorada":"...","melhorias":["..."],"conteudos_faltando":["..."],"palavras_chave":["..."]}`);
    const p=JSON.parse(raw.replace(/```json|```/g,'').trim());
    document.getElementById('r-perf').innerHTML=`<div class="ai-card">
      <div style="margin-bottom:12px"><div style="font-size:10px;color:var(--red);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Nicho</div><div style="font-size:14px">${esc(p.nicho)}</div></div>
      <div style="margin-bottom:12px"><div style="font-size:10px;color:var(--red);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Posicionamento</div><div style="font-size:14px">${esc(p.posicionamento)}</div></div>
      <div style="margin-bottom:12px;padding:12px;background:var(--greenbg);border-radius:var(--rsm)"><div style="font-size:10px;color:var(--green);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">✨ Bio Melhorada</div><div style="font-size:13px;font-style:italic">${esc(p.bio_melhorada)}</div></div>
      <div style="margin-bottom:12px"><div style="font-size:10px;color:var(--red);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">🔧 Melhorias</div>${(p.melhorias||[]).map(m=>`<div style="font-size:13px;padding:4px 0;border-bottom:1px solid var(--border)">• ${esc(m)}</div>`).join('')}</div>
      <div style="margin-bottom:12px"><div style="font-size:10px;color:var(--red);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">📱 Conteúdos Faltando</div>${(p.conteudos_faltando||[]).map(c=>`<div style="font-size:13px;padding:4px 0;border-bottom:1px solid var(--border)">📍 ${esc(c)}</div>`).join('')}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${(p.palavras_chave||[]).map(k=>`<span style="background:var(--redbg2);color:var(--red);font-size:11px;padding:2px 8px;border-radius:20px">#${esc(k)}</span>`).join('')}</div>
    </div>`;
    toast('Análise concluída! 👤','ok');
  }catch(e){document.getElementById('r-perf').innerHTML=`<div class="empty-state"><div class="empty-txt">Erro: ${esc(e.message)}</div></div>`;}

async function salvarDoAI(txt,tp,tags){
  const obj={id:gid(),txt,tp:tp||'ideia',st:'pensado',plat:'instagram',hora:'',tags:tags||[],criado:Date.now(),user_id:user.id};
  ideias.unshift(obj);
  try{await db.from('ideias').insert(obj);}catch(e){console.warn(e);}
  toast('Salvo no banco! 💡','ok');renderAll();
}
