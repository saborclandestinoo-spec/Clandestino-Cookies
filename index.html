<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorteio Clandestino Cookies</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0a;--surface:#141414;--border:#2a2a2a;--accent:#c8a96e;--red:#e02020;--text:#f0ede8;--muted:#666;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;min-height:100vh;}
  .wrap{max-width:680px;margin:0 auto;padding:2rem 1.5rem 4rem;}
  .header{text-align:center;margin-bottom:2.5rem;}
  .logo-img{max-width:320px;width:80%;margin-bottom:.5rem;}
  .sub{font-size:13px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1rem;}
  .card-title{font-family:"Bebas Neue",sans-serif;font-size:20px;letter-spacing:1px;color:var(--accent);margin-bottom:1rem;}
  .score-row{display:flex;align-items:center;justify-content:center;gap:20px;}
  .score-team{text-align:center;}
  .score-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
  .score-input{width:72px;height:72px;background:var(--bg);border:2px solid var(--border);border-radius:12px;color:var(--text);font-family:"Bebas Neue",sans-serif;font-size:40px;text-align:center;outline:none;transition:border-color .2s;}
  .score-input:focus{border-color:var(--accent);}
  .score-sep{font-family:"Bebas Neue",sans-serif;font-size:36px;color:var(--muted);}
  .btn{width:100%;padding:14px;background:var(--red);color:#fff;border:none;border-radius:10px;font-family:"Bebas Neue",sans-serif;font-size:22px;letter-spacing:2px;cursor:pointer;transition:transform .1s,opacity .2s;margin-top:1rem;}
  .btn:hover{opacity:.9;}
  .btn:active{transform:scale(0.98);}
  .btn.outline{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn.gold{background:var(--accent);color:#0a0a0a;}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem;}
  .stat{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center;}
  .stat-num{font-family:"Bebas Neue",sans-serif;font-size:32px;color:var(--accent);line-height:1;}
  .stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
  .winners-list{max-height:220px;overflow-y:auto;margin-bottom:1rem;}
  .winner-item{padding:8px 10px;border-bottom:1px solid var(--border);font-size:13px;}
  .winner-item:last-child{border-bottom:none;}
  .wi-text{color:var(--text);}
  .wi-ts{font-size:11px;color:var(--muted);margin-top:2px;}
  .drum-box{background:var(--bg);border:2px solid var(--accent);border-radius:12px;padding:1rem;margin:1rem 0;min-height:80px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .drum-wrap{overflow:hidden;height:56px;width:100%;}
  .drum-inner{transition:transform .05s linear;}
  .drum-item{font-family:"Bebas Neue",sans-serif;font-size:24px;height:56px;display:flex;align-items:center;justify-content:center;color:var(--accent);text-align:center;}
  .winner-reveal{display:none;margin-top:1rem;}
  .winner-box{background:var(--bg);border:2px solid var(--accent);border-radius:12px;padding:1.5rem;text-align:center;animation:pop .4s ease;}
  .w-emoji{font-size:32px;margin-bottom:8px;}
  .w-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:6px;}
  .w-text{font-family:"Bebas Neue",sans-serif;font-size:36px;color:var(--accent);letter-spacing:2px;line-height:1.2;word-break:break-word;margin-bottom:10px;}
  .w-time{font-size:13px;color:var(--muted);margin-bottom:16px;}
  .w-hint{background:rgba(200,169,110,.08);border:1px solid rgba(200,169,110,.25);border-radius:8px;padding:12px;font-size:13px;color:var(--text);line-height:1.7;text-align:left;}
  .w-hint strong{color:var(--accent);}
  @keyframes pop{0%{transform:scale(0.8);opacity:0}80%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
  .empty{text-align:center;color:var(--muted);font-size:14px;padding:2rem 0;}
  ::-webkit-scrollbar{width:4px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
</style>
</head>

function fmt(ts){
  const d=new Date(ts);
  return d.toLocaleString("pt-BR",{timeZone:"America/Sao_Paulo",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
}

function extractNumbers(text){
  const t=text.toLowerCase()
    .replace(/brasil/gi,"").replace(/japão/gi,"").replace(/japan/gi,"")
    .replace(/bra/gi,"").replace(/jap/gi,"")
    .replace(/🇧🇷/g,"").replace(/🇯🇵/g,"")
    .replace(/[^0-9x×a\-:.+]/g," ").trim();
  const patterns=[/(\d+)\s*[x×]\s*(\d+)/i,/(\d+)\s*a\s*(\d+)/i,/(\d+)\s*[-:.]\s*(\d+)/,/(\d+)\s+(\d+)/];
  for(const p of patterns){const m=t.match(p);if(m)return[parseInt(m[1]),parseInt(m[2])];}
  return null;
}

function matches(text,sa,sb){
  const n=extractNumbers(text);
  return n&&n[0]===sa&&n[1]===sb;
}

let winners=[];

document.getElementById("btn-filter").onclick=()=>{
  const sa=parseInt(document.getElementById("sa").value)||0;
  const sb=parseInt(document.getElementById("sb").value)||0;
  winners=COMMENTS.filter(c=>matches(c.text,sa,sb));
  document.getElementById("total-comments").textContent=COMMENTS.length;
  document.getElementById("total-winners").textContent=winners.length;
  const list=document.getElementById("winners-list");
  list.innerHTML="";
  if(!winners.length){
    list.innerHTML='<div class="empty">Nenhum comentário com esse placar.</div>';
  } else {
    winners.forEach(w=>{
      const d=document.createElement("div");
      d.className="winner-item";
      d.innerHTML=`<div class="wi-text">${w.text}</div><div class="wi-ts">🕐 ${fmt(w.ts)}</div>`;
      list.appendChild(d);
    });
  }
  document.getElementById("result-card").style.display="block";
  document.getElementById("btn-sortear").style.display=winners.length?"block":"none";
  document.getElementById("btn-novamente").style.display="none";
  document.getElementById("winner-reveal").style.display="none";
  document.getElementById("drum-box").style.display="none";
  document.getElementById("result-card").scrollIntoView({behavior:"smooth"});
};

function runDraw(){
  if(!winners.length)return;
  const winner=winners[Math.floor(Math.random()*winners.length)];
  document.getElementById("winner-reveal").style.display="none";
  document.getElementById("drum-box").style.display="flex";
  document.getElementById("btn-sortear").style.display="none";
  document.getElementById("btn-novamente").style.display="none";
  const drum=document.getElementById("drum");
  drum.innerHTML="";
  const pool=[...winners].sort(()=>Math.random()-.5).slice(0,14);
  pool.push(winner);
  pool.forEach(w=>{
    const d=document.createElement("div");
    d.className="drum-item";
    d.textContent=w.text.slice(0,26);
    drum.appendChild(d);
  });
  let pos=0,speed=55,steps=0;
  const total=pool.length;
  function spin(){
    if(pos>=total-1){
      document.getElementById("drum-box").style.display="none";
      document.getElementById("w-text").textContent=winner.text;
      document.getElementById("w-time").textContent="🕐 Postado em: "+fmt(winner.ts);
      document.getElementById("winner-reveal").style.display="block";
      document.getElementById("btn-novamente").style.display="block";
      return;
    }
    drum.style.transform=`translateY(-${pos*56}px)`;
    pos++;steps++;
    if(steps>total*0.6)speed=Math.min(speed+22,380);
    setTimeout(spin,speed);
  }
  spin();
}

document.getElementById("btn-sortear").onclick=runDraw;
document.getElementById("btn-novamente").onclick=runDraw;
</script>
